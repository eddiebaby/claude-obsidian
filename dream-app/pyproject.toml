[project]
name = "dreamapp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "python-frontmatter",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dreamapp = "dreamapp.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
